<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Account Request</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: gray;
            background-image: url(/assets/prc-cav.jpg);
            backdrop-filter: blur(2px);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #account_info h1 { 
            text-align: center;
            margin-bottom: 20px;
            color: rgb(0, 0, 0);
            font-family: "Roboto Condensed", sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            width: fit-content;
            height: fit-content;
            background-color: rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
            border-radius: 20px;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 2px 2px 30px rgb(0, 0, 0);
        }

        #account_info label {
            color: rgb(0, 0, 0);
            font-size: 16px;
            font-family: "Roboto Condensed", sans-serif;
        }

        #account_info input{
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            border-radius: 4px;
            width: 80%;
            display: block;
            margin: 0 auto 20px auto;
            height: 20px;

            border: 1px solid #ccc;
            outline: none;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px)
        }

        #account_info input:hover {
            border-color: rgb(162, 17, 17);
        }

        #account_info input:focus, #account_info select:focus {
            border: 2px solid #691a40;

            background-color: #6d6882e0;
            backdrop-filter: blur(5px)
        }

        #account_info select {
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 4px;
            width: 82%;
            height: 23px;

            border: 1px solid #ccc;
            outline: none;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px)
        }

        #account_info select:hover {
            border-color: rgb(162, 17, 17);
        }

        #account_info option{
            font-family: "Roboto Condensed", sans-serif;
            color: rgb(0, 0, 0);
        }

        #account_info button {
            color: rgb(255, 255, 255);
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 30px;
            cursor: pointer;
            border: none;
            border-width: 2px;
            height: 30px;
            width: 60%;
            display: block;
            margin: 10px auto 20px auto;
            outline: none;
            border-radius: 10px;
            background-color: #1e0b4a;
            backdrop-filter: blur(10px);
        }

        #account_info button:hover {
            background-color: #ba3439;
        }

        a {
            color: #0d032e;
            text-decoration: none;
            font-size: 18px;
            background-color: #ecd9d900;
            text-align: left;
            width: fit-content;
            margin-left: 0%;
        }

        a:hover {
            text-decoration: underline;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- TODO set all input field as required -->
    <form action="" method="post" id="account_info">
        <h1>Account Creation Request</h1>

        <label for="fname">First Name</label>
        <br>
        <input type="text" id="fname" name="fname">
        <br><br>

        <label for="mname">Middle Name</label>
        <br>
        <input type="text" id="mname" name="mname">
        <br><br>

        <label for="lname">Last Name</label>
        <br>
        <input type="text" id="lname" name="lname">
        <br><br>

        <label for="suffix">Suffix</label>
        <br>
        <select name="suffix" id="suffix">
            <option value="NA">NA</option>
            <option value="Jr">Jr</option>
            <option value="Sr">Sr</option>
            <option value="II">II</option>
            <option value="III">III</option>
            <option value="IV">IV</option>
            <option value="V">V</option>
            <option value="VI">VI</option>
            <option value="VII">VII</option>
        </select>
        <br><br>

        <label for="bdate">Birthdate</label>
        <br>
        <input type="date" id="bdate" name="bdate">
        <br><br>

        <label for="contact_no">Contact No.</label>
        <br>
        <div style="display: flex; ">
            <label style="margin: 3px -30px auto auto;">+63</label>
            <input type="text" id="contact_no" name="contact_no"
                pattern="\d{10}" maxlength="10" required
                style="width: 70%; margin: auto auto 20px auto"
            >
        </div>
        <!-- TODO use javascript to enforce number only -->
        <br><br>

        <label for="email">Email Address</label>
        <br>
        <input type="text" id="email" name="email">
        <br><br>

        <label for="username">Username</label>
        <br>
        <input type="text" id="username" name="username">
        <br><br>
        <!-- TODO add check if username exists -->

        <label for="password">Password</label>
        <br>
        <input type="password" id="password" name="password">
        <!-- TODO add confirm password input -->
        <br><br>

        <label for="branch">Office Branch</label>
        <br>
        <select name="branch" id="branch">
            <option value="chapter">Cavite Chapter</option>
            <option value="dasma">Dasmariñas</option>
            <option value="silang">Silang</option>
        </select>
        <br><br>

        <button type="submit">Submit Request</button>

        <a href="/index.html">← Cancel</a>
    </form>
</body>
</html>
