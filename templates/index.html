<!DOCTYPE html>
    <html lang="en0">
        <head>
            <meta charset="UTF-8">
<!--            <meta name="viewport" content="width=device-width, initial-scale=1.0">-->
            <meta name="viewport" content="width=device-width, initial-scale=1.00, maximum-scale=1.00, user-scalable=no">
            <title>IFGMS - Login</title>
            <link rel="stylesheet" href="{{ url_for('static', filename='styles/login_style.css') }}">
            <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" type="image/x-icon">
            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        </head>

<body style="background: linear-gradient(135deg, #fbefd5, #f5e0ea); overflow: hidden;">

  <!-- Intro Screen -->
  <div class="intro-screen" id="introScreen">
    <img src="/static/assets/IFGMS-login_logo.png" alt="Logo" class="intro-logo" />
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <img src="/static/assets/favicon.ico" alt="Loading..." class="logo-loader" />
  </div>

  <div class="wave-lines">
    <div class="wave-line"></div>
    <div class="wave-line"></div>
    <div class="wave-line"></div>
    <div class="wave-line"></div>
    <div class="wave-line"></div>
    <div class="wave-line"></div>
  </div>

    <img src="/static/assets/wavy-lines.png" alt="Logo" class="blob"/>
      <!-- Login ID Card -->
      <div class="box">
        <div class="text">
          <p>MAAB Membership System for</p>
          <p>Fund Generations Department</p>
        </div>
      </div>
    
    <div class="form-container">
  <!-- Decorative Images -->
    <img src="/static/assets/red.png" class="right-corner-img" alt="Corner Decoration" />
    <img src="/static/assets/red.png" class="left-corner-img" alt="Corner Decoration" />
    <img src="/static/assets/cross.png" class="top-corner-img" alt="Corner Decoration" />

    <!-- Login Form -->
      <div class="glass-card" id="loginForm">
        <img src="/static/assets/favicon.ico" alt="logo" class="login_logo" />
        <h1>FGMS <span>Login</span></h1>
        <p>Please login to continue.</p>
        <form action="/login" method="POST" onsubmit="return handleLogin(event)">
          <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off" />
          <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off" />
          <button type="submit">Login</button>
          <div class="divider"><span></span><span>oOo</span><span></span></div>
          <div class="forgot-password">
            <a href="/forgot_password">Forgot Password?</a>
            <h2>|</h2> 
            <a href="/create_account">Request Account</a>
  
            
          </div>
        </form>

        <div id="maab_reg" class="maab_reg">
          <a href="/membership_register">Click here to register for MAAB Membership!</a>
        </div>
        
      </div>
  </div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const intro = document.getElementById("introScreen");
      const formContainer = document.querySelector(".form-container");
  
      if (!sessionStorage.getItem("introShown")) {
        setTimeout(() => {
          intro.classList.add("fade-out");
        }, 1200);
  
        setTimeout(() => {
          intro.style.display = "none";
          formContainer.classList.add("slide-in-right");
          sessionStorage.setItem("introShown", "true");
        }, 2200);
      } else {
        intro.style.display = "none";
        formContainer.classList.add("slide-in-right");
      }
  
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            let flashData = JSON.parse(`{{ message | tojson | safe }}`);
            // TODO retire this and use javascript dialog box
            Swal.fire({
              icon: '{{ category }}',
              title: flashData.title,
              text: flashData.text,
              showConfirmButton: true,
              confirmButtonText: "Continue",
              allowOutsideClick: false,
              confirmButtonColor: '#891b19',
              background: '#1e0b4ad8',
              color: '#ffffff'
            }).then((result) => {
              if (result.isConfirmed) {
                if (flashData.redirect_url) {
                  window.location.href = flashData.redirect_url;
                } else {
                  window.location.href = "/"; // fallback
                }
              }
            });
          {% endfor %}
        {% endif %}
      {% endwith %}
    });
  
    function handleLogin(event) {
      event.preventDefault();
      document.getElementById("loadingOverlay").style.display = "flex";
      setTimeout(() => {
        event.target.submit();
      }, 300);
    }
  </script>  
</body>
</html>
