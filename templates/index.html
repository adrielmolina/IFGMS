<!DOCTYPE html>
<html lang="en0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.00, maximum-scale=1.00, user-scalable=no">
    <title>IFGMS - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/login_style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="overflow: hidden;">

<!-- Intro Screen -->
<div class="intro-screen" id="introScreen">
    <img src="/static/assets/IFGMS-login_logo.png" alt="Logo" class="intro-logo" />
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay">
  <div class="box">
    <img src="/static/assets/favicon.ico" alt="Loading..." class="logo-loader" />
  </div>
</div>


<!-- Login Form -->
 <div class="login-wrapper">
   <div class="glass-card" id="loginForm">
      <img src="/static/assets/favicon.ico" alt="logo" class="login_logo" />

      <h1>FGMS <span>Login</span></h1>
      <p>Please login to continue.</p>

   <form action="/login" method="POST" onsubmit="return handleLogin(event)">
    <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off" autofocus />
    <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off" />
        <span class="toggle-password" onclick="togglePassword()">
            <i id="eyeIcon" class="fa-solid fa-eye"></i>
        </span>
    </div>

    <!-- Forgot Password under password field, right aligned -->
    <div class="forgot-password">
        <a href="/forgot_password">Forgot Password?</a>
    </div>

    <button type="submit">Login</button>

    <!-- Divider -->
    <div class="divider"><span></span><span>  or  </span><span></span></div>

    <!-- Request Account -->
           <div class="request-account">
                <a href="/create_account">Request Account</a>
            </div>
              </form>
            </div> <!-- end of glass-card -->

            <div id="maab_reg" class="maab_reg">
                 <p>Want to be a member?</p>
                 <a ref="/membership_register">
                 <img src="static/assets/click.png" alt="Click icon" class="click-icon">
                    Click here to register for MAAB Membership
                </a>
          </div>
     </div>
</div>

<script>

// === CONFIGURATION ===
const backgrounds = [
  "/static/assets/prc_bg1.png",
  "/static/assets/prc_bg2.png",
  "/static/assets/prc_bg3.png"
];
const changeInterval = 2500; 
const fadeDuration = 700;  


// === CREATE STYLE FOR BACKGROUNDS ===
const style = document.createElement("style");
style.textContent = `
  body {
    margin: 0;
    overflow: hidden;
  }
  .bg-slide {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: opacity ${fadeDuration}ms ease-in-out;
    z-index: -1;
  }
  .bg-slide.hidden {
    opacity: 0;
  }
`;
document.head.appendChild(style);


// === CREATE TWO BACKGROUND LAYERS ===
const bg1 = document.createElement("div");
const bg2 = document.createElement("div");
bg1.className = "bg-slide";
bg2.className = "bg-slide hidden";
document.body.appendChild(bg1);
document.body.appendChild(bg2);


// === PRELOAD IMAGES ===
backgrounds.forEach(src => {
  const img = new Image();
  img.src = src;
});


// === BACKGROUND SWITCH LOGIC ===
let current = 0;
let showingFirst = true;

function changeBackground() {
  const next = (current + 1) % backgrounds.length;
  
  if (showingFirst) {
    bg2.style.backgroundImage = `url('${backgrounds[next]}')`;
    bg2.classList.remove("hidden");
    bg1.classList.add("hidden");
  } else {
    bg1.style.backgroundImage = `url('${backgrounds[next]}')`;
    bg1.classList.remove("hidden");
    bg2.classList.add("hidden");
  }

  current = next;
  showingFirst = !showingFirst;
}


// === INITIALIZE ===
bg1.style.backgroundImage = `url('${backgrounds[0]}')`;
setInterval(changeBackground, changeInterval);


    // Intro and Flash Messages
    window.addEventListener("DOMContentLoaded", () => {
        const intro = document.getElementById("introScreen");
        const formContainer = document.querySelector(".form-container");

        if (!sessionStorage.getItem("introShown")) {
            setTimeout(() => { intro.classList.add("fade-out"); }, 1200);
            setTimeout(() => {
                intro.style.display = "none";
                if (formContainer) formContainer.classList.add("slide-in-right");
                sessionStorage.setItem("introShown", "true");
            }, 2200);
        } else {
            intro.style.display = "none";
            if (formContainer) formContainer.classList.add("slide-in-right");
        }

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let flashData = JSON.parse(`{{ message | tojson | safe }}`);
                    Swal.fire({
                        icon: '{{ category }}',
                        title: flashData.title,
                        text: flashData.text,
                        showConfirmButton: true,
                        confirmButtonText: "Continue",
                        allowOutsideClick: false,
                        confirmButtonColor: '#891b19',
                        background: '#1e0b4ad8',
                        color: '#ffffff'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (flashData.redirect_url) {
                                window.location.href = flashData.redirect_url;
                            } else {
                                window.location.href = "/";
                            }
                        }
                    });
                {% endfor %}
            {% endif %}
        {% endwith %}
    });

    function handleLogin(event) {
        event.preventDefault();
        document.getElementById("loadingOverlay").style.display = "flex";
        setTimeout(() => { event.target.submit(); }, 300);
    }

    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
