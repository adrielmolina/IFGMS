<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Account Request (4x3 Grid)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <style>
    body {
      background-color: #f3e8e8;
      padding: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Roboto Condensed", sans-serif;
    }

    form {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px 30px;
      width: 90%;
      background-color: white;
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 2px 2px 30px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
      justify-items: stretch;
    }

    h1 {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 10px;
      color: black;
    }

    h2 {
      grid-column: 1 / -1;
      font-size: 20px;
      margin-top: 10px;
      color: #891b19;
      border-bottom: 2px solid #891b19;
      padding-bottom: 5px;
      text-transform: uppercase;
    }

    label {
      display: block;
      color: black;
      font-size: 16px;
      margin-bottom: 5px;
    }

    input,
    select {
      font-family: "Roboto Condensed", sans-serif;
      font-size: 16px;
      border-radius: 4px;
      width: 100%;
      border: 1px solid #ccc;
      outline: none;
      background-color: rgba(255, 255, 255, 0.4);
      color: black;
      padding: 10px;
      box-sizing: border-box;
    }

    input:hover,
    select:hover {
      border-color: rgb(162, 17, 17);
    }

    input:focus,
    select:focus {
      border: 2px solid #691a40;
      color: rgb(0, 0, 0);
    }

    select {
      cursor: pointer;
    }

    button {
      grid-column: 2 / 4;
      justify-self: center;
      color: white;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      height: 45px;
      border-radius: 10px;
      background-color: #891b19;
      width: 60%;
    }

    button:hover {
      background-color: #ba3439;
    }

    .cancel-container {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }

    .cancel-container a {
      color: black;
      text-decoration: none;
    }

    .cancel-container a:hover {
      text-decoration: underline;
      color: #891b19;
    }

    img:hover {
      border-radius: 50%;
      background-color: rgb(162, 17, 17);
    }

    /* Make contact number layout inline with +63 prefix */
    .contact-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .contact-group label {
      margin: 0;
      width: 35px;
      text-align: center;
    }

    .contact-group input {
      flex: 1;
    }

    /* Responsive behavior */
    @media (max-width: 900px) {
      form {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }

      button {
        grid-column: 1 / -1;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      let flashData = JSON.parse(`{{ message | tojson | safe }}`);

      Swal.fire({
        icon: '{{ category }}',
        title: flashData.title,
        text: flashData.text,
        showConfirmButton: true,
        confirmButtonText: "Continue",
        allowOutsideClick: false,
        confirmButtonColor: '#891b19',
        background: '#1e0b4ad8',
        color: '#ffffff'
      }).then((result) => {
        if (result.isConfirmed) {
          window.location.href = flashData.redirect_url;
        }
      });
      {% endfor %}
      {% endif %}
      {% endwith %}
    });
  </script>

  <form action="/create_acc_submit" method="POST" id="account_info">
    <h1>Account Creation Request</h1>
    <h2>Personal Information</h2>

    <div>
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" required autocomplete="off">
    </div>

    <div>
      <label for="mname">Middle Name</label>
      <input type="text" id="mname" name="mname" required autocomplete="off">
    </div>

    <div>
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" required autocomplete="off">
    </div>

    <div>
      <label for="suffix">Suffix</label>
      <select name="suffix" id="suffix">
        <option value="NA">NA</option>
        <option value="Jr">Jr</option>
        <option value="Sr">Sr</option>
        <option value="II">II</option>
        <option value="III">III</option>
        <option value="IV">IV</option>
        <option value="V">V</option>
        <option value="VI">VI</option>
        <option value="VII">VII</option>
      </select>
    </div>

    <div>
      <label for="bdate">Birthdate</label>
      <input type="date" id="bdate" name="bdate" required>
    </div>

    <div>
      <label for="contact_no">Contact No.</label>
      <div class="contact-group">
        <label>+63</label>
        <input type="text" id="contact" name="contact_no" pattern="\d{10}" maxlength="10" required autocomplete="off">
      </div>
    </div>

    <div>
      <label for="email">Email Address</label>
      <input type="text" id="email" name="email" required autocomplete="off">
    </div>

    <h2>Account Information</h2>

    <div>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="off">
    </div>

    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="off">
    </div>

    <div>
      <label for="conf_password">Confirm Password</label>
      <input type="password" id="conf_password" name="conf_password" required autocomplete="off">
    </div>

    <div>
      <label for="branch">Office Branch</label>
      <select name="branch" id="branch">
        <option value="chapter">Cavite Chapter</option>
        <option value="dasma">Dasmariñas</option>
        <option value="silang">Silang</option>
      </select>
    </div>

    <div></div> <!-- filler to align grid -->

    <button type="submit">Submit Request</button>

    <div class="cancel-container">
      <a href="/">
        <img src="/static/assets/back_button.png" alt="Cancel" width="30" height="30">
      </a>
      <h3 style="color:black;">Cancel</h3>
    </div>
  </form>

  <script src="/static/js/input-restrictions.js"></script>
</body>

</html>
