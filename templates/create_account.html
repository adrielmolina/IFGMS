<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Account Request</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: gray;
            background-image: url(/static/assets/prc-cav.jpg);
            backdrop-filter: blur(2px);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #account_info h1 { 
            text-align: center;
            margin-bottom: 20px;
            color: white;
            font-family: "Roboto Condensed", sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            width: fit-content;
            height: fit-content;
            background-color: #1e0b4ad8;
            box-sizing: border-box;
            border-radius: 20px;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 2px 2px 30px rgb(0, 0, 0);
        }

        #account_info label {
            color: white;
            font-size: 16px;
            font-family: "Roboto Condensed", sans-serif;
        }

        #account_info input{
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            border-radius: 4px;
            width: 80%;
            display: block;
            margin: 0 auto 20px auto;
            height: 20px;

            border: 1px solid #ccc;
            outline: none;
            background-color: rgba(255, 255, 255, 0.4);
            color: white;
            backdrop-filter: blur(5px)
        }

        #account_info input:hover {
            border-color: rgb(162, 17, 17);
        }

        #account_info input:focus, #account_info select:focus {
            border: 2px solid #691a40;

            background-color: #6d6882e0;
            backdrop-filter: blur(5px)
        }

        #account_info select {
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 4px;
            width: 82%;
            height: 23px;

            border: 1px solid #ccc;
            outline: none;
            background-color: rgba(255, 255, 255, 0.4);
            color: white;
            backdrop-filter: blur(5px)
        }

        #account_info select:hover {
            border-color: rgb(162, 17, 17);
        }

        #account_info option{
            font-family: "Roboto Condensed", sans-serif;
            color: rgb(0, 0, 0);
        }

        #account_info button {
            color: rgb(255, 255, 255);
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 30px;
            cursor: pointer;
            border: none;
            border-width: 2px;
            height: 30px;
            width: 60%;
            display: block;
            margin: 10px auto 20px auto;
            outline: none;
            border-radius: 10px;
            /* blue - 1e0b4a */
            background-color: #891b19;
            backdrop-filter: blur(10px);
        }

        #account_info button:hover {
            background-color: #ba3439;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background-color: #ecd9d900;
            text-align: left;
            width: fit-content;
            margin-left: 0%;
        }

        a:hover {
            text-decoration: underline;
            color: #891b19;
        }

        .swal2-popup {
            margin: auto !important;
            top: 50% !important;
            transform: translateY(-24%) !important;
        }

        img:hover {
            border-radius: 50%;
            background-color: rgb(162, 17, 17);
            color: white;
        }

    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let flashData = JSON.parse(`{{ message | tojson | safe }}`);

                    Swal.fire({
                        icon: '{{ category }}',  // "success" or "error"
                        title: flashData.title,
                        text: flashData.text,
                        showConfirmButton: true,
                        confirmButtonText: "Continue",
                        allowOutsideClick: false,

                        confirmButtonColor: '#891b19',  // confirm button color
                        background: '#1e0b4ad8',  // background color
                        color: '#ffffff'    //text color
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = flashData.redirect_url; // Redirect after clicking "OK"
                        }
                    });
                {% endfor %}
            {% endif %}
        {% endwith %}
    });
    </script>

    <!-- TODO disable autocomplte in all fields -  autocomplete="off" -->
    <!-- TODO set all input field as required -->
    <form action="/create_acc_submit" method="POST" id="account_info">
        <h1>Account Creation Request</h1>

        <label for="fname">First Name</label>
        <br>
        <input type="text" id="fname" name="fname" required autocomplete="off">
        <br><br>

        <label for="mname">Middle Name</label>
        <br>
        <input type="text" id="mname" name="mname" required autocomplete="off">
        <br><br>

        <label for="lname">Last Name</label>
        <br>
        <input type="text" id="lname" name="lname" required autocomplete="off">
        <br><br>

        <label for="suffix">Suffix</label>
        <br>
        <select name="suffix" id="suffix">
            <option value="NA">NA</option>
            <option value="Jr">Jr</option>
            <option value="Sr">Sr</option>
            <option value="II">II</option>
            <option value="III">III</option>
            <option value="IV">IV</option>
            <option value="V">V</option>
            <option value="VI">VI</option>
            <option value="VII">VII</option>
        </select>
        <br><br>

        <label for="bdate">Birthdate</label>
        <br>
        <input type="date" id="bdate" name="bdate" required>
        <br><br>

        <label for="contact_no">Contact No.</label>
        <br>
        <div style="display: flex; ">
            <label style="margin: 3px -30px auto auto;">+63</label>
            <input type="text" id="contact_no" name="contact_no"
                pattern="\d{10}" maxlength="10" required autocomplete="off"
                style="width: 70%; margin: auto auto 20px auto"
            >
        </div>
        <!-- TODO use javascript to enforce number only -->
        <br><br>

        <label for="email">Email Address</label>
        <br>
        <input type="text" id="email" name="email" required autocomplete="off">
        <br><br>

        <label for="username">Username</label>
        <br>
        <input type="text" id="username" name="username" required autocomplete="off">
        <br><br>
        <!-- TODO add check if username exists -->

        <label for="password">Password</label>
        <br>
        <input type="password" id="password" name="password" required autocomplete="off">
        <br><br>

        <label for="conf_password">Confirm Password</label>
        <br>
        <input type="password" id="conf_password" name="conf_password" required autocomplete="off">
        <!-- TODO validate with js if the same password input -->
        <br><br>

        <label for="branch">Office Branch</label>
        <br>
        <select name="branch" id="branch">
            <option value="chapter">Cavite Chapter</option>
            <option value="dasma">Dasmariñas</option>
            <option value="silang">Silang</option>
        </select>
        <br><br>

        <button type="submit">Submit Request</button>

        <div style="display: flex; align-items: center; gap: 5px;">
            <a href="/">
                <img src="/static/assets/back_button.png" alt="Cancel" width="30" height="30">
            </a>
            <h3 style="color:white; left:5%;">Cancel</h3>
        </div>
    </form>
</body>
</html>
