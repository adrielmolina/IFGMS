{% extends "base.html" %}

{% block title %}Profile Settings{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/profile.css') }}">



<div class="main-container">
    <div class="module_name">
        <h1>Profile Information</h1>
    </div>
    
    <div class="left-container">

        <img src="/static/assets/profile.png" class="prof" alt="Profile Image" />

        <button>Edit Profile Picture</button>

        <h5 class="name">{{ session['full_name'] }}</h5>
        <p class="level">{{ session['user_level'] }}</p>
    </div>

    <div class="profile-container">
        <h2>Account Settings</h2>

        <form action="#" method="POST" class="profile-form">
            <!-- USER DETAILS -->
            <div class="form-group">
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="full_name" placeholder="Full Name" value="{{ user_details.first_name }} {{ user_details.middle_name }} {{ user_details.last_name }}" readonly disabled />
            </div>

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Username" value="{{ user_details.username }}" readonly disabled />
            </div>

            <div class="form-group ">
                <label for="birthdate">Birthdate:</label>
                <input type="date" id="birthdate" name="birthdate" value="{{ user_details.birth_date }}" readonly disabled />
            </div>

            <!-- CONTACT INFO -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email Address" value="{{ user_details.email }}" readonly disabled />
            </div>

            <div class="form-group">
                <label for="phone">Phone number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone number" value="{{ user_details.contact_no }}" readonly disabled />
            </div>
        </form>
    </div>
</div>
{% endblock %}
