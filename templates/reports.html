{% extends 'base.html' %}

{% block title %}Reports{% endblock %}

{% block head %}

    <!-- <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script> -->
    <!-- <link href="https://unpkg.com/tabulator-tables@5.6.2/dist/css/tabulator.min.css" rel="stylesheet"> -->

{% block content %}
    <div class="module_name">
            <h1>Reports</h1>
    </div>

    <div>
    <!-- Filter container -->
    <div class="filter_search_container">
        <div class="filters_box">
            <label for="filter_year">Filter by:</label>
            <select id="filter_year">
                
                <option value="">Year</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
            </select>

                <select id="filter_category">
                    <option value="">Category</option>
                    <option value="Public">Public</option>
                    <option value="Private">Private</option>
                </select>
            </div>

            <button id="openReportsOverlay" class="btn-primary">
                <i class="fas fa-plus"></i> Add Report Data
            </button>
        </div>
    </div>

    <!-- Reports Overlay -->
<div id="reportsOverlay" class="overlay">
    <div class="overlay-content">
        <div class="overlay-header">
            <h2>Add Report Data</h2>
            <button id="closeOverlay" class="close-btn">&times;</button>
        </div>
        
        <div class="tabs">
            <button class="tab-button active" data-tab="target-actual">Target vs Actual</button>
            <button class="tab-button" data-tab="budget-expenses">Budget vs Expenses</button>
        </div>
        
        <!-- Target vs Actual Tab -->
        <div id="target-actual" class="tab-content active">
            <form id="targetActualForm" class="report-form">
                <div class="form-group">
                    <label for="dataType">Data Type:</label>
                    <select id="dataType" name="dataType" required>
                        <option value="">Select Type</option>
                        <option value="target">Set Annual Target</option>
                        <option value="actual">Add Monthly Actual</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="idCategory">ID Category:</label>
                    <select id="idCategory" name="idCategory" required>
                        <option value="">Select Category</option>
                        <option value="Classic">Classic</option>
                        <option value="Bronze">Bronze</option>
                        <option value="Silver">Silver</option>
                        <option value="Gold">Gold</option>
                        <option value="Platinum">Platinum</option>
                        <option value="Safe Card">Safe Card</option>
                        <option value="Senior">Senior</option>
                        <option value="Senior+">Senior+</option>
                    </select>
                </div>
                
                <!-- Target-specific fields (shown when dataType = 'target') -->
                <div id="targetFields" class="data-type-fields">
                    <div class="form-group">
                        <label for="targetCount">Target Count (Annual):</label>
                        <input type="number" id="targetCount" name="targetCount" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="yearSelect">Year:</label>
                        <select id="yearSelect" name="yearSelect" required>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                        </select>
                    </div>
                    
                    <div class="calculated-field">
                        <label>Calculated Target Amount:</label>
                        <span id="calculatedAmount">₱0.00</span>
                    </div>
                </div>
                
                <!-- Actual-specific fields (shown when dataType = 'actual') -->
                <div id="actualFields" class="data-type-fields" style="display: none;">
                    <div class="form-group">
                        <label for="actualCount">Actual Count (Monthly):</label>
                        <input type="number" id="actualCount" name="actualCount" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="monthSelect">Month:</label>
                        <select id="monthSelect" name="monthSelect" required>
                            <option value="">Select Month</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="actualYearSelect">Year:</label>
                        <select id="actualYearSelect" name="actualYearSelect" required>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                        </select>
                    </div>
                    
                    <div class="calculated-field">
                        <label>Calculated Actual Amount:</label>
                        <span id="calculatedActualAmount">₱0.00</span>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Data</button>
                    <button type="button" class="btn-secondary" id="cancelTarget">Cancel</button>
                </div>
            </form>
        </div>
        
        <!-- Budget vs Expenses Tab (keep your existing one) -->
        <div id="budget-expenses" class="tab-content">
            <!-- Your existing budget form here -->
        </div>
    </div>
</div>
    
    <!-- TODO hidden for now. fix later -->
    <!-- Budget vs Expenses -->
    <div class="collapse_box" hidden>
        <div class="collapse_box_header">
            <input id="bud_v_exp_check" class="collapse_box_checkbox" type="checkbox" checked data-target_div="bud_v_exp">
            <label for="bud_v_exp_check" class="collapse_box_label">BUDGET VS EXPENSES</label>
        </div>
        <div id="bud_v_exp" class="collapse_group">
            <div id="budget_v_expense_table" class="ht-theme-main"></div>
        </div>
    </div>

    <!-- Target vs Actual -->
    <div class="collapse_box">
        <div class="collapse_box_header">
            <input id="trg_v_act_check" class="collapse_box_checkbox" type="checkbox" checked data-target_div="trg_v_act">
            <label for="trg_v_act_check" class="collapse_box_label">TARGET VS ACTUAL</label>
        </div>
        <div id="trg_v_act" class="collapse_group">
            <div id="target_v_actual_table" class="ht-theme-main"></div>
        </div>
    </div>

    <!-- Per District -->
    <!-- TODO hidden for now. fix later -->
    <div class="collapse_box" hidden>
        <div class="collapse_box_header" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap;">
                <input id="per_dist_check" class="collapse_box_checkbox" type="checkbox" checked data-target_div="per_dist">
                <label for="per_dist_check" class="collapse_box_label" 
                    style="cursor:pointer; user-select:none; font-weight:600;">
                    PER DISTRICT
                </label>
            </div>

            <div>
                <input id="district-search" type="text" placeholder="Search...">
            </div>
        </div>

        <div id="per_dist" class="collapse_group">
            <div id="per_district_table" class="ht-theme-main"></div>
        </div>
    </div>
    
{% endblock %}

    // TARGET VS ACTUAL TABLE
    function initializeTargetVsActualTable() {
        const targetColumns = [
            { title: "Category", field: "category", width: "9.5rem", headerHozAlign: "center" },
            { title: "Target", headerHozAlign:"center", columns: [
                { title: "PCS", field: "target_PCS", hozAlign: "right", headerHozAlign:"center", width: "5rem", editor: "number" },
                { title: "AMT", field: "target_AMT", hozAlign: "right", headerHozAlign:"center", formatter:"money", formatterParams:{symbol:"₱", precision:0}, width: "7.5rem" }
            ]}
        ];

        ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].forEach(month => {
            targetColumns.push({
                title: month,
                headerHozAlign:"center",
                columns: [
                    { title: "PCS", field: month+"_PCS", hozAlign: "right", headerHozAlign:"center", width: "5rem", editor: "number" },
                    { title: "AMT", field: month+"_AMT", hozAlign: "right", headerHozAlign:"center", formatter:"money", formatterParams:{symbol:"₱", precision:0}, width: "7.5rem" }
                ]
            });
        });

        const categories = [
            "Classic",
            "Bronze",
            "Silver",
            "Gold",
            "Platinum",
            "Safe Card",
            "Senior",
            "Senior+"
        ];

        target_vs_actual_table = new Tabulator("#target_v_actual_table", {
            columns: targetColumns,
            autoColumns: false,
            data: categories.map(category => {
                const cost = categoryCost[category] || 0;
                const row = { 
                    category, 
                    target_PCS: 0, 
                    target_AMT: 0 
                };
                
                ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].forEach(month => {
                    row[month + "_PCS"] = 0;
                    row[month + "_AMT"] = 0;
                });
                return row;
            }),
            layout: "fitColumns",
            cellEdited: function(cell) {
                const field = cell.getField();
                const row = cell.getRow();
                const category = row.getData().category;
                const cost = categoryCost[category] || 0;
                
                // Update AMT when PCS changes
                if (field === "target_PCS") {
                    const pcs = cell.getValue();
                    row.update({ target_AMT: pcs * cost });
                } else if (field.endsWith("_PCS")) {
                    const month = field.replace("_PCS", "");
                    const pcs = cell.getValue();
                    row.update({ [month + "_AMT"]: pcs * cost });
                }
            }
        });

        // Load initial data from API
        loadTargetVsActualData();
    }

// OVERLAY FUNCTIONALITY - ENHANCED VERSION
function initializeOverlay() {
    const overlay = document.getElementById('reportsOverlay');
    const openBtn = document.getElementById('openReportsOverlay');
    const closeBtn = document.getElementById('closeOverlay');
    const cancelTarget = document.getElementById('cancelTarget');
    
    // Tab functionality
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');
    
    // Open overlay
    openBtn.addEventListener('click', function() {
        overlay.style.display = 'flex';
    });
    
    // Define closeOverlay globally
    window.closeOverlay = function() {
        overlay.style.display = 'none';
        document.getElementById('targetActualForm').reset();
        document.getElementById('budgetExpensesForm').reset();
        document.getElementById('calculatedAmount').textContent = '₱0.00';
        document.getElementById('calculatedActualAmount').textContent = '₱0.00';
        // Reset to target view
        document.getElementById('dataType').value = '';
        document.getElementById('targetFields').style.display = 'block';
        document.getElementById('actualFields').style.display = 'none';
    };
    
    closeBtn.addEventListener('click', window.closeOverlay);
    cancelTarget.addEventListener('click', window.closeOverlay);
    
    // Close overlay when clicking outside content
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
            window.closeOverlay();
        }
    });
    
    // Tab switching
    tabButtons.forEach(button => {
        button.addEventListener('click', function() {
            const targetTab = this.getAttribute('data-tab');
            
            tabButtons.forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
            
            tabContents.forEach(content => {
                content.classList.remove('active');
                if (content.id === targetTab) {
                    content.classList.add('active');
                }
            });
        });
    });
    
    // Data type switching (Target vs Actual)
    const dataTypeSelect = document.getElementById('dataType');
    const targetFields = document.getElementById('targetFields');
    const actualFields = document.getElementById('actualFields');
    
    dataTypeSelect.addEventListener('change', function() {
        if (this.value === 'target') {
            targetFields.style.display = 'block';
            actualFields.style.display = 'none';
        } else if (this.value === 'actual') {
            targetFields.style.display = 'none';
            actualFields.style.display = 'block';
        } else {
            targetFields.style.display = 'none';
            actualFields.style.display = 'none';
        }
    });
    
    // Auto-calculate amounts
    const idCategory = document.getElementById('idCategory');
    const targetCount = document.getElementById('targetCount');
    const actualCount = document.getElementById('actualCount');
    const calculatedAmount = document.getElementById('calculatedAmount');
    const calculatedActualAmount = document.getElementById('calculatedActualAmount');
    
    function calculateAmounts() {
        const category = idCategory.value;
        const cost = categoryCost[category] || 0;
        
        // Calculate target amount
        const target = parseInt(targetCount.value) || 0;
        calculatedAmount.textContent = `₱${(target * cost).toLocaleString()}`;
        
        // Calculate actual amount
        const actual = parseInt(actualCount.value) || 0;
        calculatedActualAmount.textContent = `₱${(actual * cost).toLocaleString()}`;
    }
    
    idCategory.addEventListener('change', calculateAmounts);
    targetCount.addEventListener('input', calculateAmounts);
    actualCount.addEventListener('input', calculateAmounts);
    
    // Form submission
    document.getElementById('targetActualForm').addEventListener('submit', function(e) {
        e.preventDefault();
        saveTargetOrActualData();
    });
}

    // FILTERS
    function initializeFilters() {
        const yearFilter = document.getElementById('filter_year');
        const categoryFilter = document.getElementById('filter_category');

        yearFilter.addEventListener('change', function() {
            const year = this.value;
            // Reload all tables with filtered data
            loadTargetVsActualData(year);
            loadBudgetData(year);
            loadPerDistrictData(year);
        });

        categoryFilter.addEventListener('change', function() {
            const category = this.value;
            // Filter per district table by category
            if (category) {
                perDistrictTable.setFilter("classification", "like", category);
            } else {
                perDistrictTable.clearFilter();
            }
        });
    }

    // COLLAPSE BOXES
    function initializeCollapseBoxes() {
        document.querySelectorAll('.collapse_box_header').forEach(header => {
            header.addEventListener('click', function (e) {
                if (e.target.tagName === 'LABEL' || e.target.tagName === 'INPUT') return;
                const checkbox = this.querySelector('.collapse_box_checkbox');
                if (checkbox) {
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });
        });

        document.querySelectorAll('.collapse_box_checkbox').forEach(checkbox => {
            const targetId = checkbox.dataset.target_div || checkbox.id.replace(/_check$/, '');
            const target = document.getElementById(targetId);
            if (!target) return;
            
            if (!checkbox.checked) target.style.display = 'none';
            
            checkbox.addEventListener('change', function () {
                target.style.display = this.checked ? 'flex' : 'none';
            });
        });
    }

    // API FUNCTIONS
    async function loadTargetVsActualData(year = '2025') {
        try {
            const response = await fetch(`/api/get_report/target_vs_actual/${year}`);
            const apiResult = await response.json();
            
            const categories = ["Classic", "Bronze", "Silver", "Gold", "Platinum", "Safe Card", "Senior", "Senior+"];
            const tableData = categories.map(category => {
                const cost = categoryCost[category] || 0;
                const apiMonths = apiResult[category] || {};

                const targetPCS = apiMonths[0] || 0;
                const row = {
                    category,
                    target_PCS: targetPCS,
                    target_AMT: targetPCS * cost
                };

                ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].forEach((month, i) => {
                    const pcs = apiMonths[i + 1] || 0;
                    row[month + "_PCS"] = pcs;
                    row[month + "_AMT"] = pcs * cost;
                });

                return row;
            });

            target_vs_actual_table.setData(tableData);
        } catch (error) {

    function loadSampleDistrictData() {
        const districtMunicipalities = [
            { districtNo: 1, municipality: 'Cavite City' },
            { districtNo: 1, municipality: 'Kawit' },
            // ... other municipalities
        ];

        const classifications = [
            'Public Nursery', 'Private Nursery', // ... other classifications
        ];

        const sampleData = [];
        districtMunicipalities.forEach(entry => {
            classifications.forEach(classification => {
                sampleData.push({
                    district: entry.districtNo,
                    municipality: entry.municipality,
                    classification: classification,
                    classic: Math.floor(Math.random() * 100),
                    bronze: Math.floor(Math.random() * 50),
                    silver: Math.floor(Math.random() * 30),
                    gold: Math.floor(Math.random() * 20),
                    platinum: Math.floor(Math.random() * 10),
                    enhanced_platinum: Math.floor(Math.random() * 5),
                    senior: Math.floor(Math.random() * 40),
                    senior_plus: Math.floor(Math.random() * 25),
                    total: 0 // Will be calculated
                });
            });
        });

        // Calculate totals
        sampleData.forEach(row => {
            row.total = row.classic + row.bronze + row.silver + row.gold + row.platinum + 
                       row.enhanced_platinum + row.senior + row.senior_plus;
        });

        perDistrictTable.setData(sampleData);
    }
