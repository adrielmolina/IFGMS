{% extends 'base.html' %}


{% block title %}Accounts{% endblock %}


{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/accounts.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Tabulator CSS -->
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css" rel="stylesheet">
    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <link rel="stylesheet" href="/static/styles/toast.css">
    <script src="/static/js/toast.js"></script>
{% endblock %}


{% block content %}
    <div class="module_name">
        <h1>Accounts</h1>
    </div>
    
  
    <div class="pending-requests-wrapper" hidden>
                    <div class="table-top">
                <label>
                    Show
                    <select id="pending_entries">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                    entries
                </label>
            </div>
    <div class="audit-logs_table full" spellcheck="false">
        <h4>Pending Account Requests</h4>
        <div class="search_box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="pending_search" placeholder="Search..." autocomplete="off">
            <button id="pending_clear_search"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Table layout -->
        <div class="table-container">
            <div id="pending_table"></div>

            <div class="table-bottom">
                <div class="table-info" id="pending_info"></div>

            </div>
        </div>
    </div>
</div>
    
<div class="active-requests-wrapper">
                <div class="table-top">
                <label>
                    Show
                    <select id="active_entries">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                    entries
                </label>
            </div>
    <div class="audit-logs_table full" spellcheck="false">
        <h4>Active Accounts</h4>
        <div class="search_box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="active_search" placeholder="Search..." autocomplete="off">
            <button id="active_clear_search"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="table-container">

            <div id="active_table"></div>

            <div class="table-bottom">
                <div class="table-info" id="active_info"></div>
            </div>
        </div>
    </div>
</div>

    <div id="btn_row_active" class="btn_row">
        <button id="create" name="action" value="create">NEW ACCOUNT</button>
        <button id="archive" name="archive" value="archive">ARCHIVE</button>
        <button id="reset" name="reset" value="reset" title="This will set the password to the user's Birthdate(YYYYMMDD)+initials">RESET PASSWORD ⓘ</button>
    </div>
    
    <div id="overlay" class="overlay">
        <div id="overlay-content" class="overlay-content">
            <span id="close-overlay" class="close-overlay">&times;</span>
            <div id="overlay-body" class="overlay-body">
                <!-- TODO disable autocomplte in all fields -  autocomplete="off" -->
                <!-- TODO set all input field as required -->
                <!-- TODO fix the route address for ID -->
                <form id="account_info">
                        <legend>&nbsp;CREATE ACCOUNT&nbsp;</legend>


                        <div class="parent">
                            <div class="div1">
                                <label for="fname">First Name</label>
                                <input type="text" id="fname" name="fname" required autocomplete="off">
                            </div>
                            <div class="div2">
                                <label for="mname">Middle Name</label>
                                <input type="text" id="mname" name="mname" required autocomplete="off">
                            </div>
                            <div class="div3">
                                <label for="lname">Last Name</label>
                                <input type="text" id="lname" name="lname" required autocomplete="off">
                            </div>
                            <div class="div4">
                                <label for="suffix">Suffix</label>
                                <select name="suffix" id="suffix">
                                    <option value="NA">NA</option>
                                    <option value="Jr">Jr</option>
                                    <option value="Sr">Sr</option>
                                    <option value="II">II</option>
                                    <option value="III">III</option>
                                    <option value="IV">IV</option>
                                    <option value="V">V</option>
                                    <option value="VI">VI</option>
                                    <option value="VII">VII</option>
                                </select>
                            </div>
                            <div class="div14">
                                <label for="bdate">Birthdate</label>
                                <input type="date" id="bdate" name="bdate" required>
                            </div>
                            <div class="div15">
                                <label for="contact_no">Contact No.</label>

                                <span>
                                    <input type="text" value="+63" readonly
                                        style="width: 20%;">
                                    <input type="text" id="contact_no" name="contact_no"
                                        pattern="\d{10}" maxlength="10" required autocomplete="off" style="width: 78%;">
                                </span>
                                <!-- TODO use javascript to enforce number only -->
                            </div>
                            <div class="div16">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" required autocomplete="off">
                            </div>
                            <div class="div17">
                                <label for="username">Username</label>
                                <input type="text" id="username" name="username" required autocomplete="off">
                                <!-- TODO add check if username exists -->
                            </div>
                            <div class="div18">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" required autocomplete="off">
                            </div>
                            <div class="div19">
                                <label for="conf_password">Confirm Password</label>
                                <input type="password" id="conf_password" name="conf_password" required autocomplete="off">
                                <!-- TODO validate with js if the same password input -->
                            </div>
                            <div class="div20">
                                <label for="branch">Office Branch</label>
                                <select name="branch" id="branch">
                                    <option value="chapter">Cavite Chapter</option>
                                    <option value="dasma">Dasmariñas</option>
                                    <option value="silang">Silang</option>
                                </select>
                            </div>
                            <div class="div21">
                                <button id="create_account_btn" type="button">CREATE ACCOUNT</button>   
                            </div>
                        </div>                                                     
                </form>
            </div>
        </div>
    </div>

{% endblock %}


{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {

    // ====================== SEARCH FUNCTIONALITY ======================
    const searchInputP = document.getElementById("pending_search");
    searchInputP.addEventListener("input", () => {
        const keyword = searchInputP.value.toLowerCase();
        pendingTable.setFilter((data) => {
            return Object.values(data)
                .join(" ")
                .toLowerCase()
                .includes(keyword);
        });
    });

    const searchInputA = document.getElementById("active_search");
    searchInputA.addEventListener("input", () => {
        const keyword = searchInputA.value.toLowerCase();
        activeTable.setFilter((data) => {
            return Object.values(data)
                .join(" ")
                .toLowerCase()
                .includes(keyword);
        });
    });

    document.getElementById("pending_clear_search").addEventListener("click", function () {
        const input = document.getElementById("pending_search");
        input.value = "";
        input.dispatchEvent(new Event("input")); 
    });

    document.getElementById("active_clear_search").addEventListener("click", function () {
        const input = document.getElementById("active_search");
        input.value = "";
        input.dispatchEvent(new Event("input")); 
    });

    // ====================== TABLE COLUMN DEFINITIONS ======================
    const accountColumns = [
        {formatter: "rowSelection", titleFormatter: "rowSelection", hozAlign: "center", headerSort: false, width: 50},
        {title: "ID", field: "account_id"},
        {title: "Username", field: "username"},
        {title: "Email", field: "email"},
        {title: "First Name", field: "first_name"},
        {title: "Middle Name", field: "middle_name"},
        {title: "Last Name", field: "last_name"},
        {title: "Contact No.", field: "contact_no"},
        {title: "Account Created", field: "acct_created"},
        {title: "Office", field: "office_location", editor:"list", editorParams: {
            values: {
                'Chapter': 'Chapter',
                'Dasmarinas': 'Dasmarinas',
                'Silang': 'Silang' 
            }
        },
        formatter: (cell) => `${cell.getValue()} <span style="color:#FF0033;">✎</span>`
        },
        {title: "User Level", field: "user_level", editor:"list", editorParams: {
            values: {
                'staff': 'staff',   
                'admin': 'admin',   
                'superadmin': 'superadmin',   
            }
        },
        formatter: (cell) => `${cell.getValue()} <span style="color:#FF0033;">✎</span>`
        },
        {title: "Status", field: "acct_status"},
        {title: "Account Review", field: "acct_review_date"},
    ];

    // ====================== TABLE CREATION WITH PAGINATION ======================
    const pendingTable = new Tabulator("#pending_table", {
        layout: "fitColumns",
        selectable: true,
        reactiveData: true,
        pagination: "local",
        paginationSize: 10,
        columns: accountColumns
    });

    const activeTable = new Tabulator("#active_table", {
        layout: "fitColumns",
        selectable: true,
        reactiveData: true,
        pagination: "local",
        paginationSize: 10,
        columns: accountColumns
    });

    

    // ====================== TABLE EVENTS TO UPDATE INFO ======================

// Trigger update after render finishes (page load, filter, resize, etc.)
pendingTable.on("renderComplete", () => {
    setTimeout(() => updateTableInfo(pendingTable, "pending_info"), 0);
});
activeTable.on("renderComplete", () => {
    setTimeout(() => updateTableInfo(activeTable, "active_info"), 0);
});


    // ====================== FETCH ACCOUNTS ======================
    function fetchAccounts() {
        fetch('/api/accounts')
            .then(res => res.json())
            .then(data => {
                pendingTable.setData(data.pending).then(() => updateTableInfo(pendingTable, "pending_info"));
                activeTable.setData(data.active).then(() => updateTableInfo(activeTable, "active_info"));
            });
    }
    fetchAccounts();

    // ====================== PAGINATION INFO ======================
    function updateTableInfo(table, infoId) {
    const info = document.getElementById(infoId);
    const totalRows = table.getDataCount("all");
    const page = table.getPage();
    const size = table.getPageSize();
    const start = totalRows === 0 ? 0 : (page - 1) * size + 1;
    const end = Math.min(page * size, totalRows);

    // get number of selected rows
    const selectedCount = table.getSelectedData().length;

    if (totalRows === 0) {
        info.textContent = "No entries to show";
    } else {
        info.textContent = `Showing ${start} to ${end} of ${totalRows} entries` + 
            (selectedCount > 0 ? ` • ${selectedCount} selected` : "");
    }
}


    pendingTable.on("dataLoaded", () => updateTableInfo(pendingTable, "pending_info"));
pendingTable.on("pageLoaded", () => updateTableInfo(pendingTable, "pending_info"));
pendingTable.on("rowSelectionChanged", () => updateTableInfo(pendingTable, "pending_info"));

activeTable.on("dataLoaded", () => updateTableInfo(activeTable, "active_info"));
activeTable.on("pageLoaded", () => updateTableInfo(activeTable, "active_info"));
activeTable.on("rowSelectionChanged", () => updateTableInfo(activeTable, "active_info"));


    document.getElementById("pending_entries").addEventListener("change", (e) => {
        pendingTable.setPageSize(parseInt(e.target.value));
        updateTableInfo(pendingTable, "pending_info");
    });

    document.getElementById("active_entries").addEventListener("change", (e) => {
        activeTable.setPageSize(parseInt(e.target.value));
        updateTableInfo(activeTable, "active_info");
    });

    // ====================== ACCOUNT ACTIONS ======================
    document.getElementById('create').addEventListener('click', () => {
        document.getElementById('overlay').style.display = 'flex';
    });

    document.getElementById('approve').addEventListener('click', () => {
        const selectedData = pendingTable.getSelectedData();
        const ids = selectedData.map(row => row.account_id);
        if (!ids.length) return alert("No accounts selected.");

        fetch('/api/accounts/approve', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.success ? 'Selected accounts approved!' : 'Error approving accounts.');
            fetchAccounts();
        })
        .catch(err => console.error(err));
    });

    document.getElementById('decline').addEventListener('click', () => {
        const selectedData = pendingTable.getSelectedData();
        const ids = selectedData.map(row => row.account_id);
        if (!ids.length) return alert("No accounts selected.");

        fetch('/api/accounts/decline', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.success ? 'Selected accounts declined!' : 'Error declining accounts.');
            fetchAccounts();
        })
        .catch(err => console.error(err));
    });

    document.getElementById('reset').addEventListener('click', () => {
        const selectedData = activeTable.getSelectedData();
        const ids = selectedData.map(row => row.account_id);
        if (!ids.length) return alert("No accounts selected.");

        fetch('/api/accounts/reset', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.success ? 'Successfully reset password for selected accounts!' : 'Error resetting password for accounts.');
            fetchAccounts();
        })
        .catch(err => console.error(err));
    });

    document.getElementById('archive').addEventListener('click', () => {
        const selectedData = activeTable.getSelectedData();
        const ids = selectedData.map(row => row.account_id);
        if (!ids.length) return alert("No accounts selected.");

        fetch('/api/accounts/archive', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.success ? 'Successfully archived selected account/s!' : 'Error archiving account/s.');
            fetchAccounts();
        })
        .catch(err => console.error(err));
    });

    // ====================== EDIT CELL EVENTS ======================
    activeTable.on("cellEdited", function(cell) {
        const rowData = cell.getRow().getData();
        let url, payload;

        if (cell.getField() === "user_level") {
            url = '/api/accounts/update_userlvl';
            payload = { id: rowData.account_id, user_level: cell.getValue() };
        } else if (cell.getField() === "office_location") {
            url = '/api/accounts/update_ofc';
            payload = { id: rowData.account_id, office_location: cell.getValue() };
        } else return;

        fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert(`Successfully updated ${rowData.account_id} to ${cell.getValue()}`);
                fetchAccounts();
            } else {
                alert(`Failed to update user_id ${rowData.account_id}`);
            }
        });
    });

    // ====================== OVERLAY ======================
    document.getElementById('close-overlay').addEventListener('click', function () {
        document.getElementById('overlay').style.display = 'none';
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            document.getElementById('overlay').style.display = 'none';
        }
    });

    document.getElementById('create_account_btn').addEventListener('click', function () {
        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            conf_password: document.getElementById('conf_password').value,
            email: document.getElementById('email').value,

            fname: document.getElementById('fname').value,
            mname: document.getElementById('mname').value,
            lname: document.getElementById('lname').value,
            suffix: document.getElementById('suffix').value,
            
            bdate: document.getElementById('bdate').value,
            contact_no: document.getElementById('contact_no').value,
            
            branch: document.getElementById('branch').value
        };

        fetch('/create_acc_submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                toastSuccess('Account created successfully!');
                document.getElementById('overlay').style.display = 'none';
                fetchAccounts();
            } else {
                toastError('Account creation failed'); 
            }
        }) // ✅ you forgot this
        .catch(err => console.error(err));
    });




    // ====================== PROFILE IMAGE ======================
    const navProfileImage = document.getElementById("navProfileImage");
    if (navProfileImage) {
        const savedProfileImage = localStorage.getItem("profileImage");
        if (savedProfileImage) navProfileImage.src = savedProfileImage;
    }
    
    window.addEventListener('storage', function(e) {
        if (e.key === 'profileImage' && navProfileImage) {
            navProfileImage.src = e.newValue || "/static/assets/pfp.jpg";
        }
    });

});
</script>
{% endblock %}
