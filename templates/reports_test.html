{% extends 'base.html' %}


{% block title %}Title{% endblock %}


{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='/styles/cssname.css') }}">
    <!-- Univer core and UI -->
    <script src="https://unpkg.com/@univerjs/ui@latest/dist/index.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@latest/dist/style.css" />
{% endblock %}


{% block content %}
    <div id="univer-app" style="width:100%;height:600px;"></div>
    <input type="file" id="excelFileInput" accept=".xlsx, .xls" />
{% endblock %}


{% block extra_scripts %}
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script>
        // Wait for DOM
        document.addEventListener('DOMContentLoaded', function() {
            // Create an empty workbook first
            const univer = Univer.createUniver({
    container: 'univer-app'
});

            document.addEventListener('DOMContentLoaded', function() {
    // Use Univer, not UniverUI
    const univer = Univer.createUniver({
        container: 'univer-app'
    });

        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const univerData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                univer.getWorkbook().getSheets().forEach(sheet => univer.getWorkbook().deleteSheet(sheet.getSheetId()));

                univer.getWorkbook().insertSheet({
                    sheetName: firstSheetName,
                    cellData: univerData
                });
            };
            reader.readAsArrayBuffer(file);
        });
    });
    </script>

{% endblock %}
