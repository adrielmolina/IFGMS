{% block extra_scripts %}
<script src="{{ url_for('static', filename='/js/entries_table.js')}}"></script>

<script>
    let hotInstance = null;
    function openLinkRenderer(instance, td, row, col, prop, value, cellProperties) {
    Handsontable.renderers.TextRenderer.apply(this, arguments); // Use default text renderer
    td.innerHTML = '<a href="javascript:void(0);" class="open-link">Open</a>';

    td.querySelector('.open-link').addEventListener('click', function () {
        const rowData = instance.getSourceDataAtRow(row);

        // sets the date format for the HTML date input field
        function convertToYYYYMMDD(dateStr) {
            const parts = dateStr.includes('/') ? dateStr.split('/') : dateStr.split('-');
        
            if (parts.length === 3) {
                let [month, day, year] = parts;
        
                // Pad month and day with leading zeros if necessary
                month = month.padStart(2, '0');
                day = day.padStart(2, '0');
        
                return `${year}-${month}-${day}`;
            }
        
            return ''; // Return empty if format is unrecognized
        }
    
        // Check and format the dates if they exist
        if (rowData.declaration_date) {
            rowData.declaration_date = convertToYYYYMMDD(rowData.declaration_date);
        }
        if (rowData.effectivity_date) {
            rowData.effectivity_date = convertToYYYYMMDD(rowData.effectivity_date);
        }
    

        document.getElementById(`record_id`).value = rowData.record_id;
        document.getElementById(`year`).value = rowData.year;
        document.getElementById(`id_rcv`).value = rowData.id_received;
        document.getElementById(`paid`).value = rowData.paid;
        document.getElementById(`declared`).value = rowData.declared;
        document.getElementById(`dec_date`).value = rowData.declaration_date;
        document.getElementById(`eff_date`).value = rowData.effectivity_date;
        document.getElementById(`loc_par`).value = rowData.location_particular;
        document.getElementById(`loc_cat`).value = rowData.location_category;
        document.getElementById(`municipality`).value = rowData.municipality;
        document.getElementById(`district`).value = rowData.district;
        document.getElementById(`origin`).value = rowData.origin;
        document.getElementById(`remarks`).value = rowData.remarks;
        document.getElementById(`tags`).value = rowData.tags;

        document.getElementById('overlay').style.display = 'flex';

        fetch("/api/get_entries", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ record_id: rowData.record_id }) // or whatever variable holds the record id
        })
        .then(response => response.json())
        .then(data => {
            data.forEach(row => {
                if (row.birth_date) {
                    const date = new Date(row.birth_date);
                    row.birth_date = date.toLocaleDateString('en-US');
                }
                if (row.declaration_date) {
                    const date = new Date(row.declaration_date);
                    row.declaration_date = date.toLocaleDateString('en-US');
                }
                if (row.OR_date) {
                    const date = new Date(row.OR_date);
                    row.OR_date = date.toLocaleDateString('en-US');
                }
            });

            window.renderEntriesTable(data);
        });


    });

    return td;
    }
    // for x button in overlay
    document.getElementById('close-overlay').addEventListener('click', function () {
        document.getElementById('overlay').style.display = 'none';
    });
    // close overlay on ESC key
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            document.getElementById('overlay').style.display = 'none';
        }
    });

    // for records table
    fetch("/api/get_records")
        .then(response => response.json())
        .then(data => {
            // date formats for the handsontable rows
            data.forEach(row => {
                if (row.declaration_date) {
                    // Format the date to MM-DD-YYYY
                    const date = new Date(row.declaration_date);
                    row.declaration_date = date.toLocaleDateString('en-US'); // Format it to MM-DD-YYYY
                }
                if (row.effectivity_date) {
                    // Format the date to MM-DD-YYYY
                    const date = new Date(row.effectivity_date);
                    row.effectivity_date = date.toLocaleDateString('en-US'); // Format it to MM-DD-YYYY
                }
            });   

            const container = document.getElementById('members_table');

            hotInstance = new Handsontable(container, {
                data,
                colHeaders: [
                    'Open', 'Record ID', 'Year', 'ID Received', 'Declared', 'Declaration Date', 'Effectivity Date',
                    'Location Particular', 'Location Category', 'Municipality', 'District', 'Paid', 'Origin', 'Remarks', 'Tags'
                ],
                columns: [
                { renderer: openLinkRenderer },
                { data: 'record_id', readOnly: true},
                { data: 'year' },
                { data: 'id_received', type: 'checkbox' },
                { data: 'declared', type: 'checkbox' },
                { data: 'declaration_date',
                    type: 'date',
                    dateFormat: 'MM-DD-YYYY',
                    correctFormat: true,
                    allowInvalid: false
                },
                { data: 'effectivity_date',
                    type: 'date',
                    dateFormat: 'MM-DD-YYYY',
                    correctFormat: true,
                    allowInvalid: false
                },
                { data: 'location_particular' },
                { data: 'location_category' },
                { data: 'municipality' },
                { data: 'district' },
                { data: 'paid', type: 'checkbox' },
                { data: 'origin' },
                { data: 'remarks' },
                { data: 'tags' }
                ],
                rowHeaders: true,
                stretchH: 'all',
                autoWrapRow: false,
                autoWrapCol: false,
                readOnly: true,
                licenseKey: 'non-commercial-and-evaluation'
            });
        });
        
    // Record Details Box Switch
    const record_details_check = document.getElementById('record_details_check');
    const record_details = document.getElementById('record_details');

    record_details_check.addEventListener('change', function() {
        if (this.checked) {
            record_details.style.display = 'block';  // Show div
        } else {
            record_details.style.display = 'none';   // Hide div
        }
    });
    // Entry Details Box Switch
    const entry_details_check = document.getElementById('entry_details_check');
    const entry_details = document.getElementById('entry_details');

    entry_details_check.addEventListener('change', function() {
        if (this.checked) {
            entry_details.style.display = 'block';  // Show div
        } else {
            entry_details.style.display = 'none';   // Hide div
        }
    });

    // reload table data
    function refreshMembersTable() {
        fetch("/api/get_records")
            .then(response => response.json())
            .then(data => {
                data.forEach(row => {
                    if (row.declaration_date) {
                        const date = new Date(row.declaration_date);
                        row.declaration_date = date.toLocaleDateString('en-US');
                    }
                    if (row.effectivity_date) {
                        const date = new Date(row.effectivity_date);
                        row.effectivity_date = date.toLocaleDateString('en-US');
                    }
                });
                if (hotInstance) {
                    hotInstance.loadData(data);
                }
            });
    }

    // Add Record button logic
    document.querySelector('button').addEventListener('click', function () {
        // Call backend to add a new record
        fetch('/api/add_record', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
            // Optionally, send default values here if needed
        })
        .then(response => response.json())
        .then(result => {
            // After adding, refresh the table data
            
            // open the new record entry window
            fetch("/api/get_records")
                .then(response => response.json())
                .then(data => {
                    data.forEach(row => {
                        if (row.declaration_date) {
                            const date = new Date(row.declaration_date);
                            row.declaration_date = date.toLocaleDateString('en-US');
                        }
                        if (row.effectivity_date) {
                            const date = new Date(row.effectivity_date);
                            row.effectivity_date = date.toLocaleDateString('en-US');
                        }
                    });
                    if (hotInstance) {
                        hotInstance.loadData(data);

                        // find index of the new record
                        const rowIndex = data.findIndex(row => row.record_id == result.record_id);
                        if (rowIndex !== -1) {
                            // Wait for Handsontable to render, then trigger the open link
                            setTimeout(() => {
                                const cell = hotInstance.getCell(rowIndex, 0); // 0 = "Open" column
                                if (cell) {
                                    const openLink = cell.querySelector('.open-link');
                                    if (openLink) openLink.click();
                                }
                            }, 100); // Adjust timeout if needed
                        }
                    }
                });

                // refreshMembersTable();

        })
        .catch(error => {
            alert('Error adding record');
            console.error(error);
        });
    });

    // save function
    document.getElementById('save_record_details').addEventListener('click', function () {
        // Gather data from the form fields
        const payload = {
            record_id: document.getElementById('record_id').value,
            year: document.getElementById('year').value,
            id_received: document.getElementById('id_rcv').checked,
            paid: document.getElementById('paid').checked,
            declared: document.getElementById('declared').checked,
            declaration_date: document.getElementById('dec_date').value,
            effectivity_date: document.getElementById('eff_date').value,
            location_particular: document.getElementById('loc_par').value,
            location_category: document.getElementById('loc_cat').value,
            municipality: document.getElementById('municipality').value,
            district: document.getElementById('district').value,
            origin: document.getElementById('origin').value,
            remarks: document.getElementById('remarks').value,
            tags: document.getElementById('tags').value
        };

        // Send data to backend
        fetch('/api/save_record_details', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                alert('Record details saved!');
                refreshMembersTable()
            } else {
                alert('Failed to save record details.');
            }
        })
        .catch(error => {
            alert('Error saving record details.');
            console.error(error);
        });
    });

</script>
