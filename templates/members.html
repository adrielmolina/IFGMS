{% extends 'base.html' %}


{% block title %}Members Management{% endblock %}


{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='/styles/members.css') }}">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

                                    <label for="year">Year</label>

                                </td>

                                <td>

                                        <option value="Public Kinder">Public Kinder</option>

                                        <option value="Public High School">Public High School</option>

                                        <option value="Private Senior High School">Private Senior High School</option>
                                        <option value="Public Integrated School">Public Integrated School</option>

                                        <option value="Noveleta">Noveleta</option>
                                        <option value="Rosario">Rosario</option>
                                        <option value="Bacoor">Bacoor</option>
                                        <option value="Imus">Imus</option>
                                        <option value="Dasmariñas">Dasmariñas</option>
                                        <option value="Carmona">Carmona</option>
                                        <option value="General Mariano Alvarez (GMA)">General Mariano Alvarez (GMA)</option>
                                        <option value="Silang">Silang</option>
                                        <option value="General Trias">General Trias</option>
                                        <option value="Amadeo">Amadeo</option>
                                        <option value="Indang">Indang</option>
                                        <option value="Tanza">Tanza</option>
                                        <option value="Trece Martires">Trece Martires</option>
                                        <option value="Alfonso">Alfonso</option>
                                        <option value="Gen. Emilio Aguinaldo (Bailen)">Gen. Emilio Aguinaldo (Bailen)</option>
                                        <option value="Magallanes">Magallanes</option>

                                        <option value="Naic">Naic</option>
                                        <option value="Tagaytay City">Tagaytay City</option>

                                    <label for="district">District</label>
                                    <br>
                                    <input type="text" id="district" name="district" required autocomplete="off" readonly>
                                </td>
                                
                                <td>
                                    <!-- TODO autofill based on account logged in -->

                                    <label for="origin">Origin</label>
                                    <br>
                                    <input type="text" id="origin" name="origin" required autocomplete="off">
                                </td>
                            </tr>

                            <tr>
                                <td colspan="6">
                                    <label for="remarks">Remarks</label>
                                    <br>
                                    <input type="text" id="remarks" name="remarks" required autocomplete="off">
                                </td>

                                <td>
                                    <label for="tags">Tags</label>

                                    <input type="text" id="tags" name="tags" required autocomplete="off">

                            </tr>

                    </form>
                </div>

                <div id="entries_table" class="ht-theme-main"></div>

            </div>
        </div>
    </div>
{% endblock %}

<script>

    Handsontable.renderers.TextRenderer.apply(this, arguments); // Use default text renderer
    td.innerHTML = '<a href="javascript:void(0);" class="open-link">Open</a>';

    td.querySelector('.open-link').addEventListener('click', function () {
        const rowData = instance.getSourceDataAtRow(row);

        // Populate overlay content (example below — customize as needed)

        // Show the overlay

        function convertToYYYYMMDD(dateStr) {
            const parts = dateStr.includes('/') ? dateStr.split('/') : dateStr.split('-');
        
            if (parts.length === 3) {
                let [month, day, year] = parts;
        
                // Pad month and day with leading zeros if necessary
                month = month.padStart(2, '0');
                day = day.padStart(2, '0');
        
                return `${year}-${month}-${day}`;
            }
        
            return ''; // Return empty if format is unrecognized
        }
    
        // Check and format the dates if they exist
        if (rowData.declaration_date) {
            rowData.declaration_date = convertToYYYYMMDD(rowData.declaration_date);
        }
        if (rowData.effectivity_date) {
            rowData.effectivity_date = convertToYYYYMMDD(rowData.effectivity_date);
        }
        
        document.getElementById('entries_table').innerHTML = '';

        document.getElementById(`record_id`).value = rowData.record_id;

        document.getElementById('overlay').style.display = 'flex';

        

        /* TODO change to /api/get_entries */

    return td;
    }

    document.getElementById('close-overlay').addEventListener('click', function () {
        document.getElementById('overlay').style.display = 'none';
    });


    fetch("/api/get_members")
        .then(response => response.json())
        .then(data => {

            data.forEach(row => {
                if (row.declaration_date) {
                    // Format the date to MM-DD-YYYY
                    const date = new Date(row.declaration_date);
                    row.declaration_date = date.toLocaleDateString('en-US'); // Format it to MM-DD-YYYY
