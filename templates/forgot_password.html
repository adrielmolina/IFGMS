<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFGMS - Forgot Password</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins';
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: background 1s ease-in-out;
        }

        /* Intro Screen */
        .intro-screen {
            position: fixed;
            background-color: #0a1d37;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-logo {
            width: 180px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .fade-out {
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes slideFromRight {
            0% {
                opacity: 0;
                transform: translateX(150px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-in-right {
            animation: slideFromRight 1s ease forwards;
            opacity: 0;
        }

        /* Overlay */
        #loadingOverlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(15, 15, 15, 0.8);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 1000;
        }

        /* Outer rotating rings */
        .box {
          position: relative;
          width: 7.5rem;
          height: 7.5rem;
          border-top: solid 10px #bf112e;
          border-radius: 50%;
          animation: rotate 3s infinite linear;
          box-shadow: 0 0 25px 4px rgba(191, 17, 46, 0.6);
        }

        .box:before {
          content: "";
          position: absolute;
          left: 5px;
          top: 5px;
          right: 5px;
          bottom: 5px;
          border-top: solid 9px #e63946;
          border-radius: 50%;
          animation: rotate 2s infinite linear;
          box-shadow: 0 0 20px 3px rgba(230, 57, 70, 0.6);
        }

        .box:after {
          content: "";
          position: absolute;
          top: 12px;
          left: 12px;
          right: 12px;
          bottom: 12px;
          border-top: solid 8px #8b0f23;
          border-radius: 50%;
          animation: rotate 1s infinite linear;
          box-shadow: 0 0 15px 2px rgba(139, 15, 35, 0.6);
        }

        /* Logo inside loader */
        .logo-loader {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 55px;
          height: 55px;
          transform: translate(-50%, -50%);
          animation: spinFast 0.6s linear infinite;
        }

        /* Animations */
        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* New fast spin animation */
        @keyframes spinFast {
          0% { transform: translate(-50%, -50%) rotate(0deg); }
          100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .login_logo {
            width: 80px;
            height: 80px;
            margin-bottom: 5px;
            margin-top: 30px;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: linear-gradient(225deg, rgba(249,102,92,0.8),
                                        rgba(238,80,52,0.9),
                                        rgba(231,138,138,1),
                                        rgba(231,86,75,0.9),
                                        rgba(230,77,77,0.9),
                                        rgba(232,57,57,0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 10px 20px;
            width: 450px;
            height: auto;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8),
                        inset 0 0 10px rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(100px);
        }

        .glass-card h1 {
            font-family: 'Poppins';
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .glass-card h1 span {
            font-weight: 400;
            color: #ffd1d1;
        }

        .glass-card input,
        .glass-card button {
            width: 350px;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .password-container input {
            width: 350px;
            padding: 10px;
            padding-right: 38px; 
            margin-left: 0px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .glass-card input:focus {
            outline: 3px solid #212C62;
            box-shadow: 0 0 10px #6267ff;
            transition: 0.2s;
        }

        .password-container {
            position: relative;
            width: 350px;
        }

        .toggle-password {
            position: absolute;
            top: 35%;
            right: 5px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #212C62;
            font-size: 18px;
            line-height: 1;
        }

        .divider {
            display: table; 
            font-size: 24px; 
            text-align: center; 
            width: 95%; 					
            margin: 7% auto;					
        }

        .divider span { display: table-cell; position: relative; }

        .divider span:first-child, .divider span:last-child {
            width: 50%;
            top: 13px;
            background-size: 100% 2px;
            background-position: 0 0, 0 100%;
            background-repeat: no-repeat;
        }

        .divider span:first-child {
            background-image: linear-gradient(90deg, transparent, #ffffff);
        }

        .divider span:nth-child(2) {
            color: #ffffff; padding: 0px 5px; width: auto; white-space: nowrap;
        }

        .divider span:last-child {
            background-image: linear-gradient(90deg, #ffffff, transparent);
        }

        .forgot-password {
            text-align: right;
            width: 350px;
            margin: -5px auto 15px auto;
        }

        .forgot-password a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .glass-card button,
        .request-account a {
            display: inline-block;
            width: 350px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .glass-card button,
        .request-account a {
            background-color: #212C62;
        }

        .glass-card button:hover,
        .request-account a:hover {
            background-color: #3b5edb;
            transform: scale(1.03);
            box-shadow: 0 0 8px rgba(59, 94, 219, 0.5);
        }

        .maab_reg a {
            background-color: #e63946;
            display: inline-block;
            width: 500px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .maab_reg a:hover {
            background-color: #ff707a;
            transform: scale(1.03);
            box-shadow: 0 0 8px rgba(255, 100, 100, 0.5);
        }

        /* === Spacing consistency === */
        .request-account,
        .maab_reg {
            margin-top: 15px;
            text-align: center;
        }

        .maab_reg { 
            margin-top: 20px; 
            margin-bottom: 10px; 
            font-size: 16px;
            font-weight: 500;
            text-align: center; 
            color: #fff; 
        }

        .bg-slide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 700ms ease-in-out;
            z-index: -1;
        }
        
        .bg-slide.hidden {
            opacity: 0;
        }
    </style>
</head>
<body style="overflow: hidden;">

<!-- Intro Screen -->
<div class="intro-screen" id="introScreen">
    <img src="/static/assets/CAVITE.png" alt="Logo" class="intro-logo" />
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay">
  <div class="box">
    <img src="/static/assets/favicon.ico" alt="Loading..." class="logo-loader" />
  </div>
</div>

<!-- Forgot Password Form -->
<div class="login-wrapper">
    <div class="glass-card slide-in-right" id="forgotPasswordForm">
        <img src="/static/assets/favicon.ico" alt="logo" class="login_logo" />
        
        <span>
            <h1>Forgot Password</h1>
        </span>
        
        <p>Enter your email to receive an OTP.</p>
        
        <form action="/forgot_password_otp" method="POST" onsubmit="return handleForgotPassword(event)">
            <input type="email" id="email" name="email" placeholder="Email Address" required autocomplete="off" autofocus />
            
            <button type="submit">Send OTP</button>

            <div style="text-align: center; width: 100%; margin-top: 10px;">
                <a href="/" style="color: #fff; text-decoration: none; font-size: 14px;">
                Back to Login
            </a>
            </div>
            
            <!-- Divider -->
            <div class="divider">
                <span></span>
                <span></span>
            </div>
        </form>
    </div>
</div>

<!-- Background Slides -->
<div class="bg-slide" id="bg1"></div>
<div class="bg-slide hidden" id="bg2"></div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // === CONFIGURATION ===
    const backgrounds = [
      "/static/assets/prc_bg1.png",
      "/static/assets/prc_bg2.png",
      "/static/assets/prc_bg3.png"
    ];
    const changeInterval = 2500; 
    const fadeDuration = 700;  

    // === PRELOAD IMAGES ===
    backgrounds.forEach(src => {
      const img = new Image();
      img.src = src;
    });

    // === BACKGROUND SWITCH LOGIC ===
    let current = 0;
    let showingFirst = true;

    function changeBackground() {
      const next = (current + 1) % backgrounds.length;
      
      if (showingFirst) {
        bg2.style.backgroundImage = `url('${backgrounds[next]}')`;
        bg2.classList.remove("hidden");
        bg1.classList.add("hidden");
      } else {
        bg1.style.backgroundImage = `url('${backgrounds[next]}')`;
        bg1.classList.remove("hidden");
        bg2.classList.add("hidden");
      }

      current = next;
      showingFirst = !showingFirst;
    }

    // === INITIALIZE ===
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");
    bg1.style.backgroundImage = `url('${backgrounds[0]}')`;
    setInterval(changeBackground, changeInterval);

    // Intro and Flash Messages
    window.addEventListener("DOMContentLoaded", () => {
        const intro = document.getElementById("introScreen");

        if (!sessionStorage.getItem("introShown")) {
            setTimeout(() => { intro.classList.add("fade-out"); }, 1200);
            setTimeout(() => {
                intro.style.display = "none";
                sessionStorage.setItem("introShown", "true");
            }, 2200);
        } else {
            intro.style.display = "none";
        }

        // Flash messages handling
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let flashData = JSON.parse(`{{ message | tojson | safe }}`);
                    Swal.fire({
                        icon: '{{ category }}',
                        title: flashData.title,
                        text: flashData.text,
                        showConfirmButton: true,
                        confirmButtonText: "Continue",
                        allowOutsideClick: false,
                        confirmButtonColor: '#891b19',
                        background: '#1e0b4ad8',
                        color: '#ffffff'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (flashData.redirect_url) {
                                window.location.href = flashData.redirect_url;
                            } else {
                                window.location.href = "/";
                            }
                        }
                    });
                {% endfor %}
            {% endif %}
        {% endwith %}
    });

    function handleForgotPassword(event) {
        event.preventDefault();

        // Show loading overlay
        const overlay = document.getElementById("loadingOverlay");
        overlay.style.display = "flex";

        // Disable the submit button to prevent multiple clicks
        const submitButton = event.target.querySelector('button[type="submit"]');
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = "Sending OTP...";
        }

        // Wait a short moment so the overlay appears before submission
        setTimeout(() => {
            event.target.submit();
        }, 300);
    }
</script>

</body>
</html>
