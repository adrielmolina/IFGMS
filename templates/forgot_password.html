<!DOCTYPE html>
    <html lang="en0">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
            <title>IFGMS - Forgot Password</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
            
            <style>
                body {
                    background-color: gray;
                    background-image: url(/assets/prc-cav.jpg);
                    background-image: url(/static/assets/prc-cav.jpg);
                    backdrop-filter: blur(8px);
                    background-size: cover;
                    background-repeat: no-repeat;
                    background-position: center center;
                    background-attachment: fixed;
                    
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    min-height: 95vh;
                    
                }
        
                #reset_pass h1, h3 { 
                    text-align: right;
                    margin-bottom: 20px;
                    color: rgb(255, 255, 255);
                    font-family: "Roboto Condensed", sans-serif;
                }
                
                p {
                    color: white;
                    font-family: "Roboto Condensed", sans-serif;
                }

                form {
                    display: flex;
                    flex-direction: column;
                    width: fit-content;
                    height: fit-content;
                    background-color: #1e0b4ad8;
                    box-sizing: border-box;
                    border-radius: 20px;
                    text-align: center;
                    padding: 20px;
                    backdrop-filter: blur(15px);
                    box-shadow: 2px 2px 30px rgb(0, 0, 0);
                }
        
                #reset_pass input{
                    font-family: "Roboto Condensed", sans-serif;
                    font-size: 18px;
                    border-radius: 5px;
                    width: 80%;
                    display: block;
                    margin: 0 auto 20px auto;
                    height: 30px;
        
                    border: 1px solid #ccc;
                    outline: none;
                    background-color: rgba(255, 255, 255, 0.4);
                    color: white;
                    backdrop-filter: blur(5px)
                }
        
                #reset_pass input:hover {
                    border-color: rgb(162, 17, 17);
                }
        
                #reset_pass input:focus, #reset_pass select:focus {
                    border: 2px solid #691a40;
        
                    background-color: #6d6882e0;
                    backdrop-filter: blur(5px)
                }
        
                #reset_pass button {
                    color: rgb(255, 255, 255);
                    font-family: "Roboto Condensed", sans-serif;
                    font-size: 16px;
                    margin-top: 10px;
                    margin-bottom: 30px;
                    cursor: pointer;
                    border: none;
                    border-width: 2px;
                    height: 30px;
                    width: 60%;
                    display: block;
                    margin: 10px auto 20px auto;
                    outline: none;
                    border-radius: 5px;
                    background-color: #891b19;
                    backdrop-filter: blur(10px);
                }
        
                #reset_pass button:hover {
                    background-color: #ba3439;
                }
        
                img:hover {
                    border-radius: 50%;
                    background-color: rgb(162, 17, 17);
                    color: white;
                }
                
                hr {
                    width: 95%;
                    border: 1px solid white;
                }
            </style>
        </head>
        <!-- TODO disable autocomplte in all fields -  autocomplete="off" -->
        <body>
            <form action="" method="POST" id="reset_pass">
                <div style="display:flex; justify-content:center; align-items:center; gap:100px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a href="index.html">
                            <img src="/assets/back_button.png" alt="BACK" width="30" height="30">
                        </a>
                        <h3 style="color:white; left:5%;">Forgot Password</h3>
                    </div>
                    <img src="/assets/prc_logo.png" alt="PRC LOGO" width="50" height="50" style="box-shadow: 5px 5px 15px rgb(0, 0, 0); border-radius:50%;">
        <body>
            <form action="/reset_pass_email" method="POST" id="reset_pass">
                <div style="display:flex; justify-content:center; align-items:center; gap:100px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a href="/">
                            <img src="/static/assets/back_button.png" alt="BACK" width="30" height="30">
                        </a>
                        <h3 style="color:white; left:5%;">Forgot Password</h3>
                    </div>
                    <img src="/static/assets/prc_logo.png" alt="PRC LOGO" width="50" height="50" style="box-shadow: 5px 5px 15px rgb(0, 0, 0); border-radius:50%;">
                </div>
                <hr>
                <p>Enter your email address associated with your account. <br>
                    We will send an OTP to verify if it’s you.
                </p>
                <input type="text" id="email" name="email" placeholder="Email Address" required>
                <input type="text" id="email" name="email" placeholder="Email Address" required autocomplete="off">
                <button type="submit">Continue</button>
                <hr>
            </form>
        </body>    
    </html>
