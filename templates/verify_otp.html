<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFGMS - Verify OTP</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins';
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: background 1s ease-in-out;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .login_logo {
            width: 80px;
            height: 80px;
            margin-bottom: 5px;
            margin-top: 30px;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: linear-gradient(225deg, rgba(249,102,92,0.8),
                                        rgba(238,80,52,0.9),
                                        rgba(231,138,138,1),
                                        rgba(231,86,75,0.9),
                                        rgba(230,77,77,0.9),
                                        rgba(232,57,57,0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 10px 20px;
            width: 450px;
            height: auto;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8),
                        inset 0 0 10px rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(100px);
        }

        .glass-card h1 {
            font-family: 'Poppins';
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .glass-card h1 span {
            font-weight: 400;
            color: #ffd1d1;
        }

        .glass-card input,
        .glass-card button {
            width: 70px;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .glass-card input:focus {
            outline: 3px solid #212C62;
            box-shadow: 0 0 10px #6267ff;
            transition: 0.2s;
        }

        .divider {
            display: table; 
            font-size: 24px; 
            text-align: center; 
            width: 95%; 					
            margin: 7% auto;					
        }

        .divider span { display: table-cell; position: relative; }

        .divider span:first-child, .divider span:last-child {
            width: 50%;
            top: 13px;
            background-size: 100% 2px;
            background-position: 0 0, 0 100%;
            background-repeat: no-repeat;
        }

        .divider span:first-child {
            background-image: linear-gradient(90deg, transparent, #ffffff);
        }

        .divider span:nth-child(2) {
            color: #ffffff; padding: 0px 5px; width: auto; white-space: nowrap;
        }

        .divider span:last-child {
            background-image: linear-gradient(90deg, #ffffff, transparent);
        }

        .glass-card button {
            background-color: #212C62;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .glass-card button:hover {
            background-color: #3b5edb;
            transform: scale(1.03);
            box-shadow: 0 0 8px rgba(59, 94, 219, 0.5);
        }

        /* OTP Input Styles */
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .otp-input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: #ffffff;
            color: #212C62;
            outline: none;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            border-color: #212C62;
            box-shadow: 0 0 8px rgba(33, 44, 98, 0.5);
        }

        .resend-otp {
            color: #ffd1d1;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .resend-otp:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .bg-slide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 700ms ease-in-out;
            z-index: -1;
        }
        
        .bg-slide.hidden {
            opacity: 0;
        }
    </style>
</head>
<body style="overflow: hidden;">

<!-- OTP Verification Form -->
<div class="login-wrapper">
    <div class="glass-card" id="verifyOtpForm">
        <img src="/static/assets/favicon.ico" alt="logo" class="login_logo" />
        
        <h1>Verify <span>OTP</span></h1>
        
        <p>Enter the 6-digit OTP sent to your email address.</p>
        
        <div class="divider">
            <span></span>
            <span>Enter OTP</span>
            <span></span>
        </div>
        
        <form action="/verify_otp" method="POST" onsubmit="return handleOtpVerification(event)">
            <!-- Hidden email input field -->
            <input type="hidden" name="email" value="{{ email }}">
            
            <!-- OTP Input Fields -->
            <div class="otp-container">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
            </div>
            
            <!-- Hidden field to store the complete OTP -->
            <input type="hidden" id="otp" name="otp" required>
            
            <button type="submit">Verify OTP</button>
            
            <!-- Back to Login link -->
            <div style="text-align: center; width: 100%; margin-top: 10px;">
                <a href="/" style="color: #fff; text-decoration: none; font-size: 14px;">
                    Back to Login
                </a>
            </div>
        </form>
        
        <div class="divider">
            <span></span>
            <span>Didn't receive OTP?</span>
            <span></span>
        </div>
        
        <a href="#" class="resend-otp" onclick="resendOtp()">Resend OTP</a>
    </div>
</div>

<!-- Background Slides -->
<div class="bg-slide" id="bg1"></div>
<div class="bg-slide hidden" id="bg2"></div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // === CONFIGURATION ===
    const backgrounds = [
      "/static/assets/prc_bg1.png",
      "/static/assets/prc_bg2.png",
      "/static/assets/prc_bg3.png"
    ];
    const changeInterval = 2500; 

    // === BACKGROUND SWITCH LOGIC ===
    let current = 0;
    let showingFirst = true;

    function changeBackground() {
      const next = (current + 1) % backgrounds.length;
      
      if (showingFirst) {
        bg2.style.backgroundImage = `url('${backgrounds[next]}')`;
        bg2.classList.remove("hidden");
        bg1.classList.add("hidden");
      } else {
        bg1.style.backgroundImage = `url('${backgrounds[next]}')`;
        bg1.classList.remove("hidden");
        bg2.classList.add("hidden");
      }

      current = next;
      showingFirst = !showingFirst;
    }

    // === INITIALIZE ===
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");
    bg1.style.backgroundImage = `url('${backgrounds[0]}')`;
    setInterval(changeBackground, changeInterval);

    // OTP Input Functionality
    function initializeOtpInputs() {
        const otpInputs = document.querySelectorAll('.otp-input');
        
        otpInputs.forEach((input, index) => {
            // Focus on first input
            if (index === 0) {
                input.focus();
            }
            
            // Handle input - only allow numbers
            input.addEventListener('input', (e) => {
                // Remove any non-numeric characters
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                const value = e.target.value;
                
                // If input has value and there's a next input, focus it
                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                
                updateHiddenOtpField();
            });
            
            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                pasteData.split('').forEach((char, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = char;
                    }
                });
                updateHiddenOtpField();
                
                // Focus last input
                if (otpInputs[pasteData.length - 1]) {
                    otpInputs[pasteData.length - 1].focus();
                } else if (otpInputs[5]) {
                    otpInputs[5].focus();
                }
            });
        });
    }
    
    function updateHiddenOtpField() {
        const otpInputs = document.querySelectorAll('.otp-input');
        const otp = Array.from(otpInputs).map(input => input.value).join('');
        document.getElementById('otp').value = otp;
    }

    function handleOtpVerification(event) {
        event.preventDefault();
        
        const otp = document.getElementById('otp').value;
        
        if (otp.length !== 6) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid OTP',
                text: 'Please enter the complete 6-digit OTP.',
                confirmButtonColor: '#891b19',
                background: '#1e0b4ad8',
                color: '#ffffff'
            });
            return false;
        }

        // Submit the form
        event.target.submit();
        return true;
    }

    function resendOtp() {
        Swal.fire({
            icon: 'success',
            title: 'OTP Resent!',
            text: 'A new OTP has been sent to your email.',
            confirmButtonColor: '#891b19',
            background: '#1e0b4ad8',
            color: '#ffffff'
        });
    }

    // Initialize OTP inputs when page loads
    document.addEventListener('DOMContentLoaded', function() {
        initializeOtpInputs();
    });

    // Flash messages handling
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                let flashData = JSON.parse(`{{ message | tojson | safe }}`);
                Swal.fire({
                    icon: '{{ category }}',
                    title: flashData.title,
                    text: flashData.text,
                    showConfirmButton: true,
                    confirmButtonText: "Continue",
                    allowOutsideClick: false,
                    confirmButtonColor: '#891b19',
                    background: '#1e0b4ad8',
                    color: '#ffffff'
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (flashData.redirect_url) {
                            window.location.href = flashData.redirect_url;
                        } else {
                            window.location.href = "/";
                        }
                    }
                });
            {% endfor %}
        {% endif %}
    {% endwith %}
</script>

</body>
</html>
